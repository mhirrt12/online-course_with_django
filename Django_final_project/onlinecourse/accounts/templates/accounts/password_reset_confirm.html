<h2>Set New Password</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.non_field_errors }}

    {% for field in form %}
        <p>
            {{ field.label_tag }}
            {{ field }}
        </p>

        {% for error in field.errors %}
            <p style="color: red;">
                {{ error }}
            </p>
        {% endfor %}
    {% endfor %}

    <button type="submit">Change Password</button>
</form>
