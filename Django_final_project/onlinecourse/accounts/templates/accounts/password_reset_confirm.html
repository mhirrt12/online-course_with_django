<h2>Set New Password</h2>

{% if validlink %}

    <p>Reset link is valid ✅</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Change Password</button>
    </form>

{% else %}

    <p style="color: red;">
        This password reset link is invalid or expired.
    </p>

{% endif %}
