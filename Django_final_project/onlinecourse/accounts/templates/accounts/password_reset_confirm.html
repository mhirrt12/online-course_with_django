<h1>Set New Password 🔐</h1>

<p>Valid link: {{ validlink }}</p>

{% if validlink %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>
    </form>

{% else %}

    <p>❌ This reset link is invalid.</p>

{% endif %}
