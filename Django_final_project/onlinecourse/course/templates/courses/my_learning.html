<h1>My Learning</h1>

{% for progress in course_progress %}
    <h2>CourseName:{{progress.course}}</h2>
    <h3>TotalLessons: {{progress.total_lessons }}</h3>
    <h3>CompletedLessons: {{progress.completed_lessons }}</h3>
    <h3>Progress: {{progress.progress }}</h3>
{% empty %}
    <p>You haven't enrolled in any courses yet.</p>
{% endfor %}
