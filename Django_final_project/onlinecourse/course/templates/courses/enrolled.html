<h1>My Courses</h1>

{% for item in dashboard_courses %}

    <h2>{{ item.course.title }}</h2>

    <p>
        Progress: {{ item.progress|floatformat:0 }}%
    </p>

    <div>
        <a href="{% url 'coursedetail' item.course.id %}">
            Continue Learning
        </a>
    </div>

{% empty %}

    <p>You haven't enrolled in any courses yet.</p>

{% endfor %}

<a href="{% url 'saved_courses' %}">
    View Saved Courses
</a>
